project:
  type: website
  post-render:
    - scripts/normalize-pretty-urls.sh
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!source-material/**"
  resources:
    - about.html
    - computational-topology/index.html
    - mathematics/year-4-h1/index.html
    - mmw/index.html

website:
  title: "RJ Nieto"
  site-url: "https://rjnieto.com"
  description: "The personal website of Rey Joseph Nieto, featuring public service, teaching, writing, and independent mathematics, AI, and machine-learning research as a hobby."
  image: /assets/images/rey-joseph-nieto-social-preview.png
  favicon: assets/branding/rj-logo.png
  open-graph:
    site-name: "RJ Nieto"
    locale: en_GB
  twitter-card:
    creator: "@rjosephnieto"
    site: "@rjosephnieto"
    card-style: summary_large_image

  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: cv/index.qmd
        text: CV
      - text: Teaching
        menu:
          - href: teaching/index.qmd
            text: Overview
          - href: teaching/bulsu/math-modern-world/index.qmd
            text: MMW101
          - href: teaching/bulsu/living-it-era/index.qmd
            text: MST101d
      - href: calculated/index.qmd
        text: Writing
      - href: research/index.qmd
        text: Hobby

  page-navigation: true
  back-to-top-navigation: true
  search: true

  page-footer:
    left: "© 2026 RJ Nieto"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header: includes/identity-metadata.html
    include-before-body: includes/accessibility-before-body.html
    include-after-body: includes/accessibility-after-body.html
    toc: true
    toc-depth: 3
    code-copy: true
    html-math-method: mathjax
    link-citations: true

execute:
  freeze: auto

lang: en-GB

# Keep page descriptions in search and social metadata without repeating them
# in the visible title block.
hide-description: true
canonical-url: true
