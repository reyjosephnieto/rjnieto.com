project:
  type: website
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!source-material/**"
  resources:
    - about.html
    - mmw/index.html

website:
  title: "RJ Nieto"
  site-url: "https://rjnieto.com"
  description: "The personal website of Rey Joseph Nieto, featuring mathematics, education, and information technology."
  favicon: Rj-logo.png
  open-graph:
    site-name: "RJ Nieto"
    locale: en_GB
  twitter-card:
    creator: "@rjosephnieto"
    site: "@rjosephnieto"

  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - text: Teaching
        menu:
          - href: teaching/index.qmd
            text: Overview
          - href: teaching/bulsu/math-modern-world/index.qmd
            text: MMW101
          - href: teaching/bulsu/living-it-era/index.qmd
            text: MST101d
      - href: cv/index.qmd
        text: CV

  page-navigation: true
  back-to-top-navigation: true
  search: true

  page-footer:
    left: "© 2026 RJ Nieto"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header: includes/identity-metadata.html
    toc: true
    toc-depth: 3
    code-copy: true
    html-math-method: mathjax
    link-citations: true

execute:
  freeze: auto

lang: en-GB
