project:
  type: website
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!source-material/**"

website:
  title: "RJ Nieto"
  site-url: "https://rjnieto.com"
  description: "Mathematics, computation, topology, and teaching."
  favicon: Rj-logo.png

  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: computational-topology/index.qmd
        text: TDA
      - href: teaching/index.qmd
        text: Teaching
      - href: teaching/bulsu/math-modern-world/index.qmd
        text: MMW
      - href: cv/index.qmd
        text: CV

  sidebar:
    title: "Computational Topology"
    style: docked
    contents:
      - computational-topology/index.qmd
      - section: "Foundations"
        contents:
          - computational-topology/metric-spaces/index.qmd
          - computational-topology/topological-spaces/index.qmd
          - computational-topology/graphs-digital-images/index.qmd
          - computational-topology/complexes/index.qmd
          - computational-topology/linear-algebra/index.qmd
      - section: "Homology and persistence"
        contents:
          - computational-topology/homology/index.qmd
          - computational-topology/computing-homology/index.qmd
          - computational-topology/persistent-homology/index.qmd
          - computational-topology/stability/index.qmd
      - section: "Research application"
        contents:
          - computational-topology/computational-stability/index.qmd
          - computational-topology/reliability-engineering/index.qmd
          - computational-topology/retinal-case-study/index.qmd
      - section: "Advanced"
        contents:
          - computational-topology/functoriality-triangulation/index.qmd

  page-navigation: true
  back-to-top-navigation: true
  search: true

  page-footer:
    left: "© 2026 RJ Nieto"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    html-math-method: mathjax
    link-citations: true

execute:
  freeze: auto

bibliography: computational-topology/references.bib
